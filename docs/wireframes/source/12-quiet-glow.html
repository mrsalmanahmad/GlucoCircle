<!-- Reference only: extracted from ../GlucoCircle-wireframes.html with font data removed. Not runnable. Use it to read exact sizes, colours, copy and state logic. -->
<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>GlucoCircle – Quiet glow</title>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#FFC857}a:hover{color:#FFD98A}
@keyframes ffglow{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.25);opacity:1}}
@keyframes ffring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.6);opacity:0}}
.ff{animation:ffglow 3.6s ease-in-out infinite}
.ffring{animation:ffring 3.6s ease-out infinite}
@media (prefers-reduced-motion:reduce){.ff,.ffring{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; padding: 52px 20px 28px; background: #0B1026; color: #F3F1EA; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
  <header style="display: flex; align-items: center; justify-content: space-between">
    <a href="Fireflies.dc.html" aria-label="Back to the sky" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #F3F1EA">
      <svg width="24" height="24" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <span style="font-size: 13px; font-weight: 600; color: #A9B0CF">Glowing · 26 min left</span>
  </header>

  <div aria-hidden="true" style="position: relative; height: 200px; display: flex; align-items: center; justify-content: center">
    <span class="ffring" style="position: absolute; width: 150px; height: 150px; border-radius: 75px; border: 1px solid rgba(255, 200, 87, 0.6)"></span>
    <span class="ffring" style="position: absolute; width: 150px; height: 150px; border-radius: 75px; border: 1px solid rgba(255, 200, 87, 0.6); animation-delay: 1.8s"></span>
    <span class="ff" style="width: 34px; height: 34px; border-radius: 17px; background: #FFC857; box-shadow: 0 0 30px 12px rgba(255, 200, 87, 0.5), 0 0 80px 30px rgba(255, 170, 60, 0.15)"></span>
    <sc-for list="{{sparks}}" as="s" hint-placeholder-count="4">
      <span style="position: absolute; left: {{s.x}}; top: {{s.y}}; width: 6px; height: 6px; border-radius: 3px; background: #FFD98A; box-shadow: 0 0 8px 3px rgba(255, 217, 138, 0.5)"></span>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px; text-align: center">
    <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: 30px; font-weight: 600">You're glowing quietly</h1>
    <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #C9CDE3">No one can message you. People who feel the same can only send warmth.</p>
  </div>

  <section aria-labelledby="warm-h" style="background: #151C3B; border: 1px solid #262F57; border-radius: 20px; padding: 6px 16px 10px; display: flex; flex-direction: column">
    <h2 id="warm-h" style="margin: 10px 0 4px; font-size: 15px; font-weight: 700"><span style="color: #FFC857">{{count}}</span> people sent you warmth</h2>
    <sc-for list="{{warmth}}" as="w" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #262F57">
        <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: #FFC857; box-shadow: 0 0 8px 3px rgba(255, 200, 87, 0.5)"></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 14px; font-weight: 600">{{w.who}}</span>
          <span style="font-size: 12px; color: #A9B0CF">{{w.note}}</span>
        </span>
        <button type="button" sc-camel-on-click="{{w.back}}" aria-pressed="{{w.sent}}" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid {{w.border}}; background: {{w.bg}}; color: {{w.fg}}; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer">{{w.label}}</button>
      </div>
    </sc-for>
  </section>

  <div style="flex: 1"></div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <a href="Morning.dc.html" style="height: 54px; border-radius: 27px; border: 1px solid #323C6E; color: #E4E6F2; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; text-decoration: none">Dim my glow</a>
    <a href="FireflyChat.dc.html" style="height: 54px; border-radius: 27px; background: #FFC857; color: #1A1300; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; text-decoration: none">I'm open to talk</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { back: {} };
  }
  renderVals() {
    const warmth = [
      { who: 'Omar · Cairo', note: 'Also can’t sleep · 2 min ago' },
      { who: 'A firefly in Delhi', note: 'Newly diagnosed · 6 min ago' },
      { who: 'Rahim · Dhaka', note: 'Been there · 12 years · 9 min ago' },
      { who: 'Fatima · Karachi', note: 'Feeling heavy too · 14 min ago' }
    ];
    return {
      count: warmth.length,
      sparks: [{ x: '24%', y: '22%' }, { x: '72%', y: '30%' }, { x: '30%', y: '74%' }, { x: '68%', y: '70%' }],
      warmth: warmth.map((w, i) => {
        const on = !!this.state.back[i];
        return { ...w, sent: on ? 'true' : 'false', label: on ? 'Sent' : 'Glow back', bg: on ? '#FFC857' : 'transparent', fg: on ? '#1A1300' : '#FFD98A', border: on ? '#FFC857' : '#5A4A20',
          back: () => this.setState({ back: { ...this.state.back, [i]: true } }) };
      })
    };
  }
}
</script>


</body></html>
