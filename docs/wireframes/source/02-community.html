<!-- Reference only: extracted from ../GlucoCircle-wireframes.html with font data removed. Not runnable. Use it to read exact sizes, colours, copy and state logic. -->
<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>GlucoCircle – Community</title>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1E4FD8}a:hover{color:#163BA6}
</style>
</helmet>
<div style="width: 390px; height: 920px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F6FA; color: #0F1A2E; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; position: relative">
  <main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 56px 20px 20px">
    <header style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Community</h1>
        <p style="margin: 0; font-size: 14px; color: #4F5B6E">You are not alone in this.</p>
      </div>
      <button type="button" aria-label="Search posts" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E3E8F0; background: #FFFFFF; color: #0F1A2E; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
      </button>
    </header>

    <div role="group" aria-label="Topics" style="display: flex; gap: 8px; overflow: hidden; flex-shrink: 0">
      <sc-for list="{{topics}}" as="t" hint-placeholder-count="5">
        <button type="button" sc-camel-on-click="{{t.pick}}" aria-pressed="{{t.pressed}}" style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.fg}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap">{{t.label}}</button>
      </sc-for>
    </div>

    <a href="Fireflies.dc.html" style="flex-shrink: 0; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 20px; background: #0B1026; color: #F3F1EA; text-decoration: none">
      <div aria-hidden="true" style="position: relative; width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: #151C3B">
        <span style="position: absolute; left: 10px; top: 12px; width: 8px; height: 8px; border-radius: 4px; background: #FFC857; box-shadow: 0 0 8px 3px rgba(255, 200, 87, 0.55)"></span>
        <span style="position: absolute; left: 26px; top: 20px; width: 6px; height: 6px; border-radius: 3px; background: #FFC857; box-shadow: 0 0 7px 3px rgba(255, 200, 87, 0.5)"></span>
        <span style="position: absolute; left: 16px; top: 28px; width: 5px; height: 5px; border-radius: 3px; background: #FFC857; box-shadow: 0 0 6px 2px rgba(255, 200, 87, 0.5)"></span>
      </div>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 700">Fireflies · who's awake now</span>
        <span style="font-size: 13px; color: #C9CDE3">Talk to someone who feels the same, right now</span>
      </span>
      <svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="#FFC857" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{posts}}" as="p" hint-placeholder-count="3">
        <article style="background: #FFFFFF; border: 1px solid #E3E8F0; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: center; gap: 10px">
            <div aria-hidden="true" style="width: 40px; height: 40px; border-radius: 20px; background: {{p.avBg}}; color: {{p.avFg}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">{{p.initials}}</div>
            <div style="flex: 1; display: flex; flex-direction: column; gap: 1px">
              <span style="font-size: 14px; font-weight: 700">{{p.name}}</span>
              <span style="font-size: 12px; color: #4F5B6E">{{p.tag}} · {{p.when}}</span>
            </div>
            <span style="font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: #F1F3F8; color: #34405A">Feeling {{p.mood}}</span>
            <a href="Report.dc.html" aria-label="Post options and report" style="width: 44px; height: 44px; margin-right: -10px; display: flex; align-items: center; justify-content: center; color: #4F5B6E">
              <svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
            </a>
          </div>
          <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #1F2A40">{{p.text}}</p>
          <div style="display: flex; gap: 8px">
            <button type="button" sc-camel-on-click="{{p.relate}}" aria-pressed="{{p.related}}" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #E3E8F0; background: {{p.relBg}}; color: {{p.relFg}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px">
              <svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
              I relate · {{p.relCount}}
            </button>
            <button type="button" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #E3E8F0; background: #FFFFFF; color: #34405A; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px">
              <svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>
              {{p.replies}} replies
            </button>
          </div>
        </article>
      </sc-for>
    </div>
  </main>

  <a href="Share.dc.html" style="position: absolute; right: 20px; bottom: 100px; height: 52px; padding: 0 20px; border-radius: 26px; background: #1E4FD8; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; box-shadow: 0 8px 20px rgba(30, 79, 216, 0.3)">
    <svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Share your story</a>

  <nav aria-label="Main" style="height: 80px; flex-shrink: 0; display: flex; justify-content: space-around; align-items: center; background: #FFFFFF; border-top: 1px solid #E3E8F0; padding: 0 6px 10px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 64px; min-height: 52px; text-decoration: none; color: #5B6576; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a href="Community.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 64px; min-height: 52px; text-decoration: none; color: #1E4FD8; font-size: 12px; font-weight: 700">
      <svg width="24" height="24" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"></path><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8"></path><path d="M18 14.3c2 .8 3.5 2.8 3.5 5.7"></path></svg>Community</a>
    <a href="Share.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 64px; min-height: 52px; text-decoration: none; color: #5B6576; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8M8 12h8"></path></svg>Share</a>
    <a href="Signs.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 64px; min-height: 52px; text-decoration: none; color: #5B6576; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>Signs</a>
    <a href="Healthy.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 64px; min-height: 52px; text-decoration: none; color: #5B6576; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-8 5-14 15-15-1 10-7 15-15 15z"></path><path d="M5 19l8-8"></path></svg>Healthy</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:920}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { topic: 'All', related: {} };
  }
  renderVals() {
    const labels = ['All', 'Newly diagnosed', 'Type 1', 'Type 2', 'Food', 'Caregivers'];
    const posts = [
      { initials: 'HK', name: 'Hamza K.', tag: 'Newly diagnosed', when: '2h', mood: 'anxious', avBg: '#E8EEFD', avFg: '#1E4FD8', rel: 24, replies: 18,
        text: 'Diagnosed with type 2 last week. Still taking it in. How did you all get through the first month?' },
      { initials: 'SN', name: 'Sana N.', tag: 'Food', when: '5h', mood: 'hopeful', avBg: '#E8F5EC', avFg: '#166534', rel: 41, replies: 12,
        text: 'Swapped a full plate of rice for half rice, daal and salad. My after-lunch readings have been much steadier.' },
      { initials: 'Anon', name: 'Anonymous', tag: 'Caregivers', when: '1d', mood: 'tired', avBg: '#FFF4E5', avFg: '#8A3D05', rel: 17, replies: 9,
        text: 'My father keeps skipping his evening walk. Any tips for keeping elders motivated without nagging?' }
    ];
    const rel = this.state.related;
    return {
      topics: labels.map((l) => {
        const on = this.state.topic === l;
        return { label: l, pressed: on ? 'true' : 'false', bg: on ? '#0F1A2E' : '#FFFFFF', fg: on ? '#FFFFFF' : '#34405A', border: on ? '#0F1A2E' : '#E3E8F0',
          pick: () => this.setState({ topic: l }) };
      }),
      posts: posts.map((p, i) => {
        const on = !!rel[i];
        return { ...p, initials: p.initials === 'Anon' ? '?' : p.initials, related: on ? 'true' : 'false', relCount: p.rel + (on ? 1 : 0),
          relBg: on ? '#E8EEFD' : '#FFFFFF', relFg: on ? '#1E4FD8' : '#34405A',
          relate: () => this.setState({ related: { ...this.state.related, [i]: !this.state.related[i] } }) };
      })
    };
  }
}
</script>


</body></html>
